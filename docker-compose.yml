services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rrr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rrr_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-royal_rail_restro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rrr_user} -d ${POSTGRES_DB:-royal_rail_restro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rrr_user}:${POSTGRES_PASSWORD:-rrr_secure_password_2026}@db:5432/${POSTGRES_DB:-royal_rail_restro}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-rrr_user}:${POSTGRES_PASSWORD:-rrr_secure_password_2026}@db:5432/${POSTGRES_DB:-royal_rail_restro}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    profiles:
      - full
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
